<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="juiceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow ring -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.15" />

  <!-- Cup / Glass with shadow -->
  <g filter="url(#shadow)">
    <!-- Juice Cup Body -->
    <path d="M176 170 L196 350 Q200 376 256 376 Q312 376 316 350 L336 170 Z" fill="#ffffff" opacity="0.2" />
    <path d="M182 195 L198 344 Q202 366 256 366 Q310 366 314 344 L330 195 Z" fill="url(#juiceGrad)" />

    <!-- Cup Rim & Lid -->
    <ellipse cx="256" cy="170" rx="84" ry="18" fill="#ffffff" />
    <ellipse cx="256" cy="170" rx="72" ry="12" fill="#ecfdf5" />

    <!-- Straw -->
    <path d="M260 170 L285 85 Q288 75 300 75 L330 75" fill="none" stroke="#fcd34d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Fresh Leaf -->
    <path d="M200 155 C170 140 160 105 185 85 C215 90 225 125 200 155 Z" fill="url(#leafGrad)" />
    <path d="M185 85 Q195 120 200 155" fill="none" stroke="#047857" stroke-width="3" />

    <!-- Citrus Slice on Rim -->
    <circle cx="320" cy="155" r="26" fill="#fbbf24" stroke="#ffffff" stroke-width="4" />
    <circle cx="320" cy="155" r="20" fill="#f59e0b" />
    <circle cx="320" cy="155" r="5" fill="#ffffff" />
  </g>

  <!-- Typography: MiJUS -->
  <text x="256" y="430" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">
    MiJUS
  </text>
  <text x="256" y="462" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#a7f3d0" letter-spacing="3">
    GO HEALTHY
  </text>
</svg>
