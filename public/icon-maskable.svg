<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="juiceGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="leafGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for safe zone masking -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Centered Scaled Content within 80% safe zone (radius 200) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Juice Cup Body -->
    <path d="M176 170 L196 350 Q200 376 256 376 Q312 376 316 350 L336 170 Z" fill="#ffffff" opacity="0.2" />
    <path d="M182 195 L198 344 Q202 366 256 366 Q310 366 314 344 L330 195 Z" fill="url(#juiceGradMask)" />

    <!-- Cup Rim & Lid -->
    <ellipse cx="256" cy="170" rx="84" ry="18" fill="#ffffff" />
    <ellipse cx="256" cy="170" rx="72" ry="12" fill="#ecfdf5" />

    <!-- Straw -->
    <path d="M260 170 L285 85 Q288 75 300 75 L330 75" fill="none" stroke="#fcd34d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Fresh Leaf -->
    <path d="M200 155 C170 140 160 105 185 85 C215 90 225 125 200 155 Z" fill="url(#leafGradMask)" />
    <path d="M185 85 Q195 120 200 155" fill="none" stroke="#047857" stroke-width="3" />

    <!-- Citrus Slice on Rim -->
    <circle cx="320" cy="155" r="26" fill="#fbbf24" stroke="#ffffff" stroke-width="4" />
    <circle cx="320" cy="155" r="20" fill="#f59e0b" />
    <circle cx="320" cy="155" r="5" fill="#ffffff" />

    <!-- Typography: MiJUS -->
    <text x="256" y="430" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="4">
      MiJUS
    </text>
    <text x="256" y="462" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#a7f3d0" letter-spacing="3">
      GO HEALTHY
    </text>
  </g>
</svg>
